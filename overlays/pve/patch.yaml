apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: pve
  annotations:
    # PVE serves a self-signed certificate on 8006.
    cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: https
    cloudflare-tunnel-ingress-controller.strrl.dev/proxy-ssl-verify: "off"
spec:
  rules:
    - host: pve.ryuzu.dev
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: pve
                port:
                  number: 8006
