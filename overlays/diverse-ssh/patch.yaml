apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: diverse-ssh
  annotations:
    # cloudflared carries raw TCP for ssh:// origins.
    cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: ssh
spec:
  rules:
    - host: ssh-diverse.ryuzu.dev
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: diverse-ssh
                port:
                  number: 22
